<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#f8dce9">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta name="app-version" content="mary-parkour-20261112-01">
  <title>Mary's Parkour game</title>
  <link rel="stylesheet" href="./styles.css?v=mary-parkour-20261112-01">
  <script type="importmap">
    {"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"}}
  </script>
</head>
<body>
  <main id="game-shell">
    <div id="game-root" aria-label="3D survival game arena"></div>

    <header class="topbar">
      <a class="brand" href="#" aria-label="Mary's Parkour game home">
        <span class="brand-mark">M</span>
        <span>MARY'S <b>PARKOUR GAME</b></span>
      </a>
      <div class="top-stats">
        <div class="stat"><small>ROUND</small><strong id="round-value">1 / 10</strong></div>
        <div class="stat"><small>ALIVE</small><strong id="alive-value">10</strong></div>
        <div class="stat timer-stat"><small>TILES FALL IN</small><strong id="timer-value">5</strong></div>
      </div>
      <div class="topbar-actions">
        <button type="button" id="home-button" class="icon-button home-button hidden" aria-label="Return to home">⌂ <span>HOME</span></button>
        <button type="button" id="sound-button" class="icon-button" aria-label="Toggle sound">♪</button>
      </div>
    </header>

    <section class="challenge-panel">
      <div class="challenge-mode" id="mode-label">COLOUR RUSH</div>
      <div class="challenge-prompt" id="challenge-prompt">Find the RED tiles!</div>
      <div class="challenge-hint" id="challenge-hint"></div>
    </section>

    <div class="round-message" id="round-message" aria-live="polite"></div>

    <div class="bottom-hud">
      <div class="control-help" id="control-help">WASD / ARROWS to move · SPACE to jump</div>
      <div class="mode-chip" id="mode-chip">COLOUR RUSH</div>
    </div>

    <div class="mobile-controls" id="mobile-controls">
      <div class="direction-circle" aria-label="Circular movement controls">
        <button type="button" class="move-button move-up" data-direction="up" aria-label="Move forward">▲</button>
        <button type="button" class="move-button move-left" data-direction="left" aria-label="Move left">◀</button>
        <button type="button" class="move-button move-down" data-direction="down" aria-label="Move backward">▼</button>
        <button type="button" class="move-button move-right" data-direction="right" aria-label="Move right">▶</button>
        <span class="direction-center" aria-hidden="true">✿</span>
      </div>
      <button type="button" class="jump-button" id="jump-button">JUMP</button>
    </div>


    <section class="overlay" id="start-overlay">
      <div class="modal start-modal">
        <h1 class="game-title">Mary's Parkour game</h1>
        <div class="mode-picker">
          <label for="player-name">YOUR PLAYER NAME</label>
          <input id="player-name" class="name-input" maxlength="14" placeholder="Enter your name" value="Player">
        </div>
        <div class="mode-picker">
          <label for="mode-select">CHOOSE YOUR GAME MODE</label>
          <select id="mode-select">
            <option value="random">Surprise me — random modes</option>
            <option value="colour">Colour Rush</option>
            <option value="math">Maths Run</option>
            <option value="animal">Animal Kingdom</option>
            <option value="emoji">Emoji</option>
            <option value="word">Word Challenge</option>
            <option value="shape">Shape Shifter</option>
            <option value="memory">Memory Rush</option>
            <option value="odd">Odd One Out</option>
            <option value="truefalse">True or False</option>
            <option value="pattern">Pattern Panic</option>
          </select>
        </div>
        <button type="button" id="start-button" class="primary-button">ENTER THE ARENA <span>→</span></button>
      </div>
    </section>

    <section class="overlay hidden" id="result-overlay">
      <div class="modal result-modal">
        <div class="eyebrow" id="result-eyebrow">ROUND COMPLETE</div>
        <h2 id="result-title">You survived!</h2>
        <p id="result-copy">The next challenge is ready.</p>
        <div class="result-numbers">
          <div><strong id="result-round">1</strong><small>ROUNDS</small></div>
          <div><strong id="result-alive">1</strong><small>PLAYERS LEFT</small></div>
        </div>
        <button id="continue-button" class="primary-button">NEXT ROUND <span>→</span></button>
      </div>
    </section>

    <div class="toast" id="toast" role="status"></div>
  </main>
  <script type="module" src="./game.js?v=mary-parkour-20261112-01"></script>
</body>
</html>
